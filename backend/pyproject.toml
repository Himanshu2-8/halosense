# ─────────────────────────────────────────────────────────────────
# pyproject.toml — Python project config (ruff linter/formatter)
#
# Ruff is a fast Python linter+formatter that replaces flake8+black+isort.
# Run:  ruff check .     (lint)
#       ruff format .    (format)
#       ruff check --fix . (auto-fix)
# ─────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
